services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brigadas-laravel
    volumes:
      - .:/var/www
    environment:
      # Database
      DB_CONNECTION: pgsql
      DB_HOST: db       # Nombre del servicio del contenedor de postgres
      DB_PORT: 5432
      DB_DATABASE: brigadas_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      
      # Session Configuration (FIX for session persistence)
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_DOMAIN: .dasalas.shop  # Con punto inicial para permitir subdominios
      SESSION_SECURE_COOKIE: "false"  # false porque usamos HTTP (no HTTPS)
      SESSION_SAME_SITE: lax  # lax para HTTP, none requiere HTTPS
      SESSION_ENCRYPT: "false"
      SESSION_COOKIE: brigadas_session  # Nombre específico de la cookie
      
      # App Configuration
      APP_KEY: base64:2HDou67pKgo0aCQb0GqoiLxtCATbQ0AkVNQggKa/wK4=
      APP_URL: http://brigadas.dasalas.shop
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      
      # Microservices
      ANIMAL_REPORTS_API_URL: http://rescate.dasalas.shop/
      INVENTORY_API_URL: http://donaciones.dasalas.shop/
      DAS_API_URL: http://gatealas.dasalas.shop/api/gateway/logistica/paquetes/solicitud-publica
    depends_on:
      - db
    networks:
      - brigadas-net
  nginx:
    image: nginx:latest
    container_name: brigadas
    expose:
      - "80"
    # ports:
    #   - "8080:80" #---> despliegue local con puerto 8080
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - brigadas-net
      - internal-network
      - proxy-network
  db:
    image: postgis/postgis:16-3.4
    container_name: brigadas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: brigadas_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - brigadas-net

networks:
  brigadas-net:
    driver: bridge
  internal-network:
    external: true
  proxy-network:
    external: true

volumes:
  db-data: